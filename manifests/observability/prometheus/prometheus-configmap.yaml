apiVersion: v1
kind: ConfigMap
metadata:
  name: clusterprobe-prometheus-config
  labels:
    app.kubernetes.io/name: clusterprobe
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: clusterprobe
    app.kubernetes.io/managed-by: kustomize
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: clusterprobe-alloy
        metrics_path: /metrics
        static_configs:
          - targets: ["clusterprobe-alloy:12345"]
