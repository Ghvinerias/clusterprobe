{{- $autoscaling := default dict .Values.worker.autoscaling }}
{{- $keda := default dict $autoscaling.keda }}
{{- if and .Values.worker.enabled (default false $keda.enabled) }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "clusterprobe.componentName" (dict "root" . "component" "worker") }}
  namespace: {{ include "clusterprobe.namespace" . }}
  labels:
    {{- include "clusterprobe.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "clusterprobe.componentName" (dict "root" . "component" "worker") }}
  minReplicaCount: {{ default 1 $keda.minReplicaCount }}
  maxReplicaCount: {{ default 10 $keda.maxReplicaCount }}
  pollingInterval: {{ default 30 $keda.pollingInterval }}
  cooldownPeriod: {{ default 300 $keda.cooldownPeriod }}
  triggers:
    - type: rabbitmq
      metadata:
        queueName: {{ default "workload.high" $keda.queueName | quote }}
        hostFromEnv: CP_RABBITMQ_URL
{{- end }}
