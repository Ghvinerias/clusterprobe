{{- if and .Values.api.enabled .Values.chaos.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "clusterprobe.componentName" (dict "root" . "component" "api") }}-chaos
  namespace: {{ include "clusterprobe.namespace" . }}
  labels:
    {{- include "clusterprobe.componentLabels" (dict "root" . "component" "chaos-mesh") | nindent 4 }}
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources:
      - podchaos
      - networkchaos
      - iochaos
      - stresschaos
      - timechaos
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "clusterprobe.componentName" (dict "root" . "component" "api") }}-chaos
  namespace: {{ include "clusterprobe.namespace" . }}
  labels:
    {{- include "clusterprobe.componentLabels" (dict "root" . "component" "chaos-mesh") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "clusterprobe.componentName" (dict "root" . "component" "api") }}-chaos
subjects:
  - kind: ServiceAccount
    name: {{ include "clusterprobe.componentName" (dict "root" . "component" "api") }}
    namespace: {{ include "clusterprobe.namespace" . }}
{{- end }}
