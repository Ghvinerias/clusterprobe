{{- if .Values.chaos.enabled }}
{{- $serviceName := include "clusterprobe.componentName" (dict "root" . "component" "chaos-mesh") }}
{{- $namespace := include "clusterprobe.namespace" . }}
{{- $altNames := list $serviceName (printf "%s.%s" $serviceName $namespace) (printf "%s.%s.svc" $serviceName $namespace) (printf "%s.%s.svc.cluster.local" $serviceName $namespace) }}
{{- $ca := genCA (printf "%s-ca" $serviceName) 3650 }}
{{- $cert := genSignedCert $serviceName nil $altNames 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serviceName }}-webhook-certs
  namespace: {{ $namespace }}
  labels:
    {{- include "clusterprobe.componentLabels" (dict "root" . "component" "chaos-mesh") | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
